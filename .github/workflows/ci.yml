name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  system-exercise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out example system
        uses: actions/checkout@v4
        with:
          path: TypedMarkExample

      - name: Check out reference tooling
        uses: actions/checkout@v4
        with:
          repository: DeveloPassion/TypedMark
          ref: 63277e0f86c49fc54e13425b0b6add5b4d71342f
          path: TypedMark

      - name: Check out specification evidence baseline
        uses: actions/checkout@v4
        with:
          repository: DeveloPassion/TypedMarkSpecification
          ref: a386e1de0d5730845a5f6836f75402bb6f9883df
          path: TypedMarkSpecification

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked tooling dependencies
        working-directory: TypedMark
        run: bun install --frozen-lockfile

      - name: Validate the system definition
        working-directory: TypedMarkExample
        run: bun ../TypedMark/src/cli.ts validate . --schemas ../TypedMarkSpecification/schema/json-schema --mode system_definition

      - name: Instantiate and validate offline
        working-directory: TypedMarkExample
        run: |
          # The importer refuses targets inside the source system.
          bun ../TypedMark/src/cli.ts instantiate . "$RUNNER_TEMP/ci-instance" --name ci-working-notes --schemas ../TypedMarkSpecification/schema/json-schema
          bun ../TypedMark/src/cli.ts validate "$RUNNER_TEMP/ci-instance" --schemas ../TypedMarkSpecification/schema/json-schema --mode instantiated_collection

      - name: Print the notes view of the instance
        working-directory: TypedMarkExample
        run: bun ../TypedMark/src/cli.ts view "$RUNNER_TEMP/ci-instance" notes --schemas ../TypedMarkSpecification/schema/json-schema

      - name: Require manual resolution without history
        working-directory: TypedMarkExample
        run: |
          if bun ../TypedMark/src/cli.ts migration-readiness . --from 0.0.1 --schemas ../TypedMarkSpecification/schema/json-schema; then
            echo "Expected migration readiness to require manual resolution"
            exit 1
          fi
